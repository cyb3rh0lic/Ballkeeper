<!doctype html><meta charset="utf-8">
<h3>SSE Test</h3>
<label>adminId: <input id="mid" value="1000"></label>
<button id="btn">Connect</button>
<pre id="log"></pre>
<script>
    const log = m => (document.getElementById('log').textContent += m + "\n");
    document.getElementById('btn').onclick = () => {
        const mid = document.getElementById('mid').value;
        const es = new EventSource(`/api/notifications/connect?memberId=${encodeURIComponent(mid)}`);
        es.onopen = () => log('[open]');
        es.addEventListener('reservation-created', e => log('[reservation-created] ' + e.data));
        es.onmessage = e => log('[message] ' + e.data);
        es.onerror = () => log('[error]');
    };
</script>
